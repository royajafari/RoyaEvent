# پیکربندی Nginx برای production — TLS اجباری (بخش ۱۱ پلن + تصمیم صریح کاربر).
#
# قبل از اولین دیپلوی: همه‌جا "royaevent.example.com" رو با دامنه‌ی واقعی
# جایگزین کن (مستقیم ادیت کن یا:
#   sed -i 's/royaevent.example.com/دامنه‌ی-واقعی-شما/g' infra/nginx/conf.d/royaevent.conf
# ). راهنمای کامل ترتیب اجرا (issue گواهی قبل از بالا آوردن nginx) در
# docs/deployment_tls.md است — بدون رعایت اون ترتیب، nginx به‌خاطر نبود
# فایل گواهی اصلاً بالا نمی‌آد.

server {
    listen 80;
    listen [::]:80;
    server_name royaevent.example.com;

    # مسیر چالش Let's Encrypt — هم برای صدور اولیه (اگر با webroot به‌جای
    # standalone انجام بشه) هم برای تمدید دوره‌ای، همیشه از پورت ۸۰ باز می‌مونه
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # هر درخواست دیگری اجباراً به HTTPS ریدایرکت می‌شه
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name royaevent.example.com;

    ssl_certificate     /etc/letsencrypt/live/royaevent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/royaevent.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — به مرورگر می‌گه همیشه HTTPS رو مستقیم استفاده کنه، حتی بار بعد
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # کلیپ تبلیغاتی تا ۳۰ مگابایت (بخش سرویس ویدیو) + کمی سربار
    client_max_body_size 35M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
